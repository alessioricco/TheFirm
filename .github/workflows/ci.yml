# CI for a PUBLIC repo: guard, lint, types, tests. No network in tests,
# no data and no secrets in the tree. Breaking a firm rule fails the build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux arm64 checks are required on main; macOS arm64 runs too but is
        # informational (GitHub's macOS capacity often leaves jobs unstarted).
        os: [ubuntu-24.04-arm, macos-latest]
        python: ["3.12", "3.14"]           # floor and latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Repo guard (no data, secrets, machine paths, big files)
        run: python3 scripts/check_repo.py --all
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: OS sandbox for agent strategy code (bubblewrap)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 blocks unprivileged user namespaces by default; the
        # runner is throwaway, so allow them for bubblewrap.
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Firm rules
        run: uv run pytest tests/invariants -ra
      - name: All tests
        env:
          FIRM_REQUIRE_SANDBOX: "1"  # sandbox tests fail here, never skip
        run: uv run pytest -ra

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
