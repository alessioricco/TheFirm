# Market profile: crypto spot. Milestone 1. Numbers are placeholders to calibrate.
market: crypto
calendar: 24x7
currency: USD               # USD-quoted pairs; P&L converted to GBP at fx_conversion_bps
universe:
  source: exchanges         # listings from the venues below, delisted pairs kept
  include_delisted: true
data:
  history: [coinbase, kraken, binance]   # registered providers (firm.data.providers)
  realtime: [kraken_ws, coinbase_ws]
  stale_after_seconds: 60     # no trade for this long: stale feed, no new paper orders
costs:
  commission:               # fee schedule per venue (config/fees/)
    kraken: kraken_pro_tier1
    coinbase: coinbase_advanced_tier1
  spread_model: quoted
  spread_bps: 2             # assumed full spread for bar backtests (placeholder)
  slippage_bps: 5
  fx_conversion_bps: 3      # GBP to USD
funding_rates: false        # spot only in v1 (no leverage, no perpetuals)
broker:
  paper: simulator
  live: [kraken, coinbase]  # inactive while live_trading is false
