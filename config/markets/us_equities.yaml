# Market profile: US shares. Milestone 6. Numbers are placeholders to calibrate.
market: us_equities
calendar: XNYS             # exchange hours, holidays, early closes
currency: USD
universe:
  source: eodhd
  include_delisted: true
data:
  history: [eodhd, yahoo]   # eodhd planned; yahoo available (unofficial)
  realtime: ibkr
  stale_after_seconds: 120     # no trade for this long: stale feed, no new paper orders
costs:
  commission: ibkr_tiered
  spread_model: quoted
  spread_bps: 2             # assumed full spread for bar backtests (placeholder)
  slippage_bps: 5
  fx_conversion_bps: 3      # GBP to USD
corporate_actions: [splits, dividends]
execution:
  participation: 0.1        # paper fills take at most 10% of each trade/bar's volume (placeholder)
  rebalance_threshold_pct: 2  # ignore exposure changes under 2% of the market's equity
  heartbeat_timeout_seconds: 10  # no risk heartbeat for this long: no new orders
  fx:                       # USD -> GBP from a live market price, never a typed-in rate
    provider: kraken_ws
    symbol: GBP/USD
    base: GBP
    quote: USD
    max_age_seconds: 3600   # older rates are unusable: risk rejects buys it can't value
broker:
  paper: simulator
  live: ibkr                # inactive while live_trading is false
