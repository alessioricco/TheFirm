[project]
name = "firm"
version = "0.0.1"
description = "The firm: a one-person paper trading firm run by local models. Agents propose, code decides."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi==0.162.0",
    "nats-py>=2.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "httpx>=0.27",
]

[project.scripts]
firm = "firm.control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["firm", "factories"]

[tool.mypy]
python_version = "3.12"
files = ["src/firm/core"]
strict = true
plugins = ["pydantic.mypy"]

[tool.uv]
# Supply-chain cooldown for the dashboard's new dependencies (2026-11-19): no
# release younger than about two weeks. Revisit when upgrading.
constraint-dependencies = ["annotated-doc<=0.0.5"]
